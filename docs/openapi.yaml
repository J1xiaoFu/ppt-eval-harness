openapi: 3.1.0
info:
  title: PPT Eval Harness
  version: 0.8.4
  description: >-
    Product release 0.8.4 with Evaluation Profile 8.3, persisted schema 1.0 and API namespace /v1.
    These version axes evolve independently. Every write request has a 202 MiB pre-parser body
    limit. If a browser supplies Origin, only localhost or 127.0.0.1 origins are accepted; trusted
    local CLI clients without Origin remain supported.
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Service and audit-chain status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /v1/evaluations:
    post:
      operationId: createEvaluation
      description: >-
        Trusted-local compatibility entry point for a caller-managed, server-visible PPTX path.
        It must not be exposed to untrusted users. Browser and ordinary user submissions use
        /v1/evaluations/upload.
      parameters:
        - in: query
          name: async
          schema: { type: boolean, default: true }
        - in: header
          name: Idempotency-Key
          description: Reusing a key with identical content returns the original Job.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationSubmission" }
      responses:
        "200":
          description: Job state or completed report.
    get:
      operationId: listEvaluations
      responses:
        "200":
          description: Newest evaluation reports first.
  /v1/evaluations/upload:
    post:
      operationId: uploadEvaluation
      description: >-
        Recommended browser entry point. A 202 MiB ASGI body guard runs before multipart parsing;
        the handler then streams each bounded file through filename, media-type, ZIP and OOXML
        validation. Repeated source_materials and assets fields upload real auxiliary files; they
        never name server filesystem paths. Browser-originated writes are accepted only from a
        localhost or 127.0.0.1 UI. Uploaded sources, reports and audit artifacts remain local;
        configured model providers receive only selected rendered pixels and bounded context.
      parameters:
        - in: query
          name: async
          schema: { type: boolean, default: true }
        - in: header
          name: Idempotency-Key
          description: Reusing a key with identical uploaded content returns the original Job.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/EvaluationUpload" }
            encoding:
              source_materials: { style: form, explode: true }
              assets: { style: form, explode: true }
      responses:
        "200":
          description: Complete report when async=false.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: Process-local asynchronous job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationJob" }
        "400": { $ref: "#/components/responses/InvalidRequestBody" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "413": { $ref: "#/components/responses/UploadTooLarge" }
        "422": { $ref: "#/components/responses/UnsafePresentation" }
        "429": { $ref: "#/components/responses/JobQueueFull" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /v1/jobs/{job_id}:
    get:
      operationId: getEvaluationJob
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Current process-local state. COMPLETED includes run_id and review_url. Job identifiers
            are not durable across API process restarts; persisted runs remain available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationJob" }
        "404":
          description: >-
            Job not found after process restart or bounded terminal-job eviction. A persisted run,
            if already created, remains available from the review task list.
  /v1/evaluations/{run_id}:
    get:
      operationId: getEvaluation
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Complete report, manifest, and atomic evidence. }
        "404": { description: Run not found. }
  /v1/review/tasks:
    get:
      operationId: listReviewTasks
      description: >-
        Production human-audit queue projection. It consumes only persisted Harness facts;
        benchmark ranks and correlation statistics are never accepted as inputs.
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [queue, all, completed], default: queue }
        - in: query
          name: query
          schema: { type: string, default: "" }
        - in: query
          name: decision
          schema: { type: [string, "null"], enum: [PASS, REVIEW, FAIL, ERROR, null] }
        - in: query
          name: coverage
          schema: { type: [string, "null"], enum: [FULL, DEGRADED, BASE_ONLY, UNASSESSABLE, null] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Attention-prioritized audit task summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
  /v1/review/tasks/{run_id}:
    get:
      operationId: getReviewTask
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Lightweight task with attention issues, slide links, training tracks, artifacts and
            review history. Matrix, gates, routes and Manifest are loaded from the audit endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewTaskDetail" }
        "404": { description: Run not found. }
  /v1/review/tasks/{run_id}/report:
    get:
      operationId: getPublicReviewReport
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Complete report with host filesystem URIs removed. }
  /v1/review/tasks/{run_id}/audit:
    get:
      operationId: getFullReviewAudit
      description: Full Matrix, Gate/Reducer lineage, model routes, Manifest, and review history loaded on demand.
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full audit facts for the selected run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FullAuditPayload" }
        "404": { description: Run not found. }
  /v1/review/tasks/{run_id}/slides/{page_number}:
    get:
      operationId: getReviewSlide
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: page_number
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Integrity-checked rendered slide image.
          content:
            image/png: { schema: { type: string, contentEncoding: binary } }
        "404": { description: Slide unavailable. }
  /v1/review/tasks/{run_id}/artifacts/{role}:
    get:
      operationId: getReviewArtifact
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: role
          required: true
          schema:
            type: string
            enum: [source_pptx, atomic_observations, slide_render_manifest]
      responses:
        "200": { description: Run-scoped, manifest-verified artifact. }
        "404": { description: Artifact unavailable. }
        "409": { description: Artifact integrity mismatch. }
  /v1/review/tasks/{run_id}/inputs/{role}/{index}:
    get:
      operationId: getReviewInputArtifact
      description: >-
        Download one run-bound source material or asset after role, index, Manifest hash and CAS
        content hash verification. This endpoint never accepts a filesystem path or global digest.
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: role
          required: true
          schema: { type: string, enum: [source_material, asset] }
        - in: path
          name: index
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Manifest-verified input artifact download.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        "404": { description: Run or indexed input artifact unavailable. }
        "409": { description: Input artifact lineage or integrity mismatch. }
  /v1/review/tasks/{run_id}/reviews:
    get:
      operationId: listRunReviews
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Append-only review event history. }
  /v1/reviews:
    post:
      operationId: createReview
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200": { description: Immutable review record. }
  /v1/feedback:
    post:
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Immutable feedback and edit-diff record. }
  /v1/parameter-proposals:
    post:
      operationId: createParameterProposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Draft parameter proposal; this endpoint cannot publish it. }
  /v1/parameter-proposals/{proposal_id}/validate:
    post:
      operationId: validateParameterProposal
      parameters:
        - in: path
          name: proposal_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Validated or rejected proposal. }
  /v1/parameter-proposals/{proposal_id}/approve:
    post:
      operationId: approveParameterProposal
      parameters:
        - in: path
          name: proposal_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver]
              properties:
                approver: { type: string }
      responses:
        "200": { description: Approval event; two distinct approvals produce a release candidate only. }
components:
  responses:
    InvalidRequestBody:
      description: Content-Length is malformed or negative.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    OriginForbidden:
      description: A browser-originated write did not come from the local review UI.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    UploadTooLarge:
      description: The complete write request or an individual uploaded file exceeds its limit.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    UnsafePresentation:
      description: Multipart fields, filename, extension, ZIP or OOXML preflight are invalid.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    JobQueueFull:
      description: The bounded process-local job queue has no capacity.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    StorageUnavailable:
      description: The local upload or artifact store is unavailable.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
    IdempotencyConflict:
      description: The Idempotency-Key was reused with different input.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
  schemas:
    HealthStatus:
      type: object
      required: [status, service_version, audit_chain_valid, broken_event]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service_version: { const: "0.8.4" }
        audit_chain_valid: { type: boolean }
        broken_event: { type: [string, "null"] }
      additionalProperties: false
    ApiError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - { type: string }
            - $ref: "#/components/schemas/UploadErrorDetail"
    UploadErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    EvaluationUpload:
      type: object
      required: [presentation, case_id, scene]
      properties:
        presentation:
          type: string
          format: binary
          contentMediaType: application/vnd.openxmlformats-officedocument.presentationml.presentation
          description: >-
            One .pptx up to 100 MiB. The original filename is at most 120 characters,
            is display metadata only, and never becomes a caller-selected storage path.
        case_id: { type: string, minLength: 1, maxLength: 128 }
        scene:
          type: string
          enum: [text_to_ppt, project_summary, multimodal, ready_made]
        request: { type: [string, "null"], maxLength: 20000 }
        audience: { type: [string, "null"], maxLength: 2000 }
        source_materials:
          type: array
          maxItems: 16
          items: { type: string, format: binary }
          description: >-
            Repeat to upload source files; each is at most 25 MiB. Supported suffixes are .txt,
            .md, .csv, .tsv, .json, .yaml and .yml; path strings are forbidden.
        assets:
          type: array
          maxItems: 32
          items: { type: string, format: binary }
          description: Repeat to upload asset files; each is at most 25 MiB and path strings are forbidden.
      additionalProperties: false
    EvaluationJob:
      type: object
      required: [job_id, status, stage, created_at]
      properties:
        job_id: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        stage: { type: string, enum: [QUEUED, EVALUATING, READY_FOR_REVIEW, FAILED] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        input_sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        run_id: { type: [string, "null"] }
        evaluation_url: { type: [string, "null"] }
        review_task_url: { type: [string, "null"] }
        review_url:
          type: [string, "null"]
          description: Present with run_id after successful completion.
        error_code: { type: [string, "null"] }
      additionalProperties: false
    EvaluationSubmission:
      type: object
      required: [case]
      properties:
        case: { $ref: "#/components/schemas/EvalCase" }
        profile: { $ref: "#/components/schemas/EvalProfileV83" }
    EvalCase:
      type: object
      required: [case_id, scene, pptx_path]
      properties:
        case_id: { type: string, minLength: 1 }
        scene:
          type: string
          enum: [text_to_ppt, project_summary, multimodal, ready_made]
        pptx_path: { type: string, minLength: 1 }
        request: { type: [string, "null"] }
        audience: { type: [string, "null"] }
        source_materials: { type: array, items: { type: string } }
        assets: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
    EvalProfileV83:
      type: object
      required:
        - profile_id
        - version
        - base_weights
        - scene_weights
        - base_multiplier_metric_ids
        - scene_multiplier_metric_ids
        - required_metric_ids
        - pipeline_nodes
      anyOf:
        - required: [scene]
        - required: [scenario]
      properties:
        profile_id: { type: string, minLength: 1 }
        version: { const: "8.3" }
        scene: { type: string }
        scenario: { type: string }
        lambda_base: { type: number, minimum: 0, maximum: 1 }
        base_weights:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        scene_weights:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        base_multiplier_metric_ids:
          type: array
          items: { type: string, minLength: 1 }
        scene_multiplier_metric_ids:
          type: array
          items: { type: string, minLength: 1 }
        required_metric_ids:
          type: array
          items: { type: string, minLength: 1 }
        enabled_oracle_ids:
          type: array
          items: { type: string, minLength: 1 }
        pipeline_nodes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DagNodeSpec" }
        hard_gate_min_confidence: { type: number, minimum: 0, maximum: 1 }
        pass_threshold: { type: number, minimum: 0, maximum: 100 }
        review_threshold: { type: number, minimum: 0, maximum: 100 }
        metric_review_thresholds: { type: object, additionalProperties: { type: number } }
        aggregation_strategy: { type: string }
        base_metric_constructs: { type: object, additionalProperties: { type: string } }
        base_construct_weights: { type: object, additionalProperties: { type: number } }
        scene_metric_constructs: { type: object, additionalProperties: { type: string } }
        scene_construct_weights: { type: object, additionalProperties: { type: number } }
        max_retries: { type: integer, minimum: 0 }
        oracle_timeout_seconds: { type: number, exclusiveMinimum: 0 }
        cost_budget: { type: [number, "null"], minimum: 0 }
        metadata: { type: object, additionalProperties: true }
      additionalProperties: false
    DagNodeSpec:
      type: object
      required: [node_id, oracle_id, kind, dependencies]
      properties:
        node_id: { type: string, minLength: 1 }
        oracle_id: { type: string, minLength: 1 }
        kind: { type: string, enum: [OBSERVE, SELECT, AUDIT, FUSE, REDUCE, SCORE] }
        dependencies:
          type: array
          items: { type: string, minLength: 1 }
        mandatory: { type: boolean }
      additionalProperties: false
    ReviewInput:
      type: object
      required: [run_id, verdict, reviewer_id]
      properties:
        run_id: { type: string }
        verdict:
          type: string
          enum: [CONFIRM_SYSTEM_DECISION, OVERRIDE_DECISION, REQUEST_MORE_EVIDENCE]
        reviewer_id: { type: string }
        note: { type: string, default: "" }
        client_request_id: { type: string, maxLength: 128 }
        target_decision: { type: string, enum: [PASS, REVIEW, FAIL, ERROR] }
        issue_resolutions:
          type: array
          items: { $ref: "#/components/schemas/IssueResolution" }
        track_resolutions:
          type: object
          additionalProperties: { type: string, enum: [TRAIN, REVIEW, REJECT] }
    IssueResolution:
      type: object
      required: [issue_id, resolution]
      properties:
        issue_id: { type: string }
        resolution:
          type: string
          enum: [CONFIRMED, FALSE_POSITIVE, INSUFFICIENT_EVIDENCE]
        note: { type: string }
    AttentionIssue:
      type: object
      required: [issue_id, priority, title, summary, severity, status, semantic_code, consensus, rationales, detail_count, page_numbers]
      properties:
        issue_id: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        title: { type: string }
        summary: { type: string }
        severity: { type: string, enum: [INFO, MINOR, MAJOR, CRITICAL] }
        status: { type: string, enum: [OPEN, RESOLVED] }
        semantic_code: { type: string }
        consensus: { $ref: "#/components/schemas/AttentionConsensus" }
        rationales: { type: array, items: { type: string } }
        detail_count: { type: integer, minimum: 0 }
        page_numbers: { type: array, items: { type: integer, minimum: 1 } }
        evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
      additionalProperties: false
    AttentionConsensus:
      type: object
      required: [status, sources, label, supporting_count, conflicting_count]
      properties:
        status: { type: string, enum: [AGREED, CONFLICT, SINGLE_SOURCE, INSUFFICIENT] }
        sources:
          type: array
          uniqueItems: true
          items: { type: string, enum: [RULE, MODEL, REDUCER, SYSTEM] }
        label: { type: string }
        supporting_count: { type: integer, minimum: 0 }
        conflicting_count: { type: integer, minimum: 0 }
      additionalProperties: false
    AttentionSummary:
      type: object
      required: [state, title, description, total_count, required_count, raw_fact_count]
      properties:
        state:
          type: string
          enum: [ACTIONABLE, REVIEW_WITHOUT_LOCALIZED_ISSUE, NO_ISSUE, UNLOCATED_FAILURE]
        title: { type: string }
        description: { type: string }
        total_count: { type: integer, minimum: 0 }
        required_count: { type: integer, minimum: 0 }
        raw_fact_count: { type: integer, minimum: 0 }
      additionalProperties: false
    EvidenceRef:
      type: object
      required: [source, page_number]
      properties:
        source: { type: string, enum: [RULE, MODEL, REDUCER, SYSTEM] }
        page_number: { type: [integer, "null"], minimum: 1 }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
      additionalProperties: false
    ReviewTaskSummary:
      type: object
      required: [run_id, case_id, scenario, decision, coverage, score, priority, priority_reason, issue_count, page_count, review_state, created_at, profile_id, profile_version, training_tracks, latest_review, triage_policy_version, attention_summary]
      properties:
        run_id: { type: string }
        case_id: { type: string }
        scenario: { type: string }
        decision: { type: string, enum: [PASS, REVIEW, FAIL, ERROR] }
        coverage: { type: string, enum: [FULL, DEGRADED, BASE_ONLY, UNASSESSABLE] }
        score: { type: [number, "null"] }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        priority_reason: { type: string }
        issue_count: { type: integer, minimum: 0 }
        page_count: { type: integer, minimum: 0 }
        review_state: { type: string, enum: [OPEN, NEEDS_EVIDENCE, RESOLVED] }
        created_at: { type: [string, "null"], format: date-time }
        profile_id: { type: [string, "null"] }
        profile_version: { type: [string, "null"] }
        training_tracks:
          type: array
          items: { $ref: "#/components/schemas/TrainingTrack" }
        latest_review:
          oneOf:
            - { $ref: "#/components/schemas/ReviewEvent" }
            - { type: "null" }
        triage_policy_version: { type: string }
        attention_summary: { $ref: "#/components/schemas/AttentionSummary" }
    ReviewTaskDetail:
      allOf:
        - { $ref: "#/components/schemas/ReviewTaskSummary" }
        - type: object
          required: [service_version, report_hash, observation_hash, review_reasons, attention_summary, issues, slides, inputs, audit_url, artifacts, reviews, audit_integrity]
          properties:
            service_version: { type: string }
            report_hash: { type: [string, "null"] }
            observation_hash: { type: [string, "null"] }
            review_reasons: { type: array, items: { type: string } }
            attention_summary: { $ref: "#/components/schemas/AttentionSummary" }
            issues: { type: array, items: { $ref: "#/components/schemas/AttentionIssue" } }
            slides: { type: array, items: { $ref: "#/components/schemas/SlideRef" } }
            inputs: { type: array, items: { $ref: "#/components/schemas/ReviewInputArtifact" } }
            audit_url: { type: string }
            artifacts: { $ref: "#/components/schemas/ReviewArtifactLinks" }
            reviews: { type: array, items: { $ref: "#/components/schemas/ReviewEvent" } }
            audit_integrity: { $ref: "#/components/schemas/AuditIntegrity" }
      unevaluatedProperties: false
    TrainingTrack:
      type: object
      required: [track, status, reason_codes]
      properties:
        track: { type: string, enum: [visual, layout, content, full_deck] }
        status: { type: string, enum: [TRAIN, REVIEW, REJECT] }
        score: { type: [number, "null"] }
        reason_codes: { type: array, items: { type: string } }
    SlideRef:
      type: object
      required: [page_number, available]
      properties:
        page_number: { type: integer, minimum: 1 }
        available: { type: boolean }
        image_url: { type: [string, "null"] }
        thumbnail_url: { type: [string, "null"] }
    ReviewArtifactLinks:
      type: object
      required: [report, atomic_observations, source_pptx, slide_render_manifest, report_url, observations_url, source_pptx_url, render_manifest_url]
      properties:
        report: { $ref: "#/components/schemas/ArtifactAvailability" }
        atomic_observations: { $ref: "#/components/schemas/ObservationArtifactAvailability" }
        source_pptx: { $ref: "#/components/schemas/ArtifactAvailability" }
        slide_render_manifest: { $ref: "#/components/schemas/ArtifactAvailability" }
        report_url: { type: string }
        observations_url: { type: [string, "null"] }
        source_pptx_url: { type: [string, "null"] }
        render_manifest_url: { type: [string, "null"] }
      additionalProperties: false
    ArtifactAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
      additionalProperties: false
    ObservationArtifactAvailability:
      allOf:
        - { $ref: "#/components/schemas/ArtifactAvailability" }
      description: >-
        Availability and digest of the complete, untruncated AtomicObservation artifact. The
        attention summary is only a projection and never replaces this run-bound artifact.
    ReviewInputArtifact:
      type: object
      required: [role, index, original_name, media_type, size_bytes, sha256, available, download_url]
      properties:
        role: { type: string, enum: [source_material, asset] }
        index: { type: integer, minimum: 1 }
        original_name: { type: string }
        media_type: { type: string }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        available: { type: boolean }
        download_url: { type: [string, "null"] }
      additionalProperties: false
    ReviewEvent:
      type: object
      required: [review_id, run_id, reviewer_id, verdict, created_at]
      properties:
        review_id: { type: string }
        run_id: { type: string }
        reviewer_id: { type: string }
        verdict:
          type: string
          enum: [CONFIRM_SYSTEM_DECISION, OVERRIDE_DECISION, REQUEST_MORE_EVIDENCE, APPROVE, REJECT]
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        client_request_id: { type: [string, "null"] }
        target_decision: { type: [string, "null"], enum: [PASS, REVIEW, FAIL, ERROR, null] }
        machine_decision: { type: [string, "null"], enum: [PASS, REVIEW, FAIL, ERROR, null] }
        machine_coverage: { type: [string, "null"], enum: [FULL, DEGRADED, BASE_ONLY, UNASSESSABLE, null] }
        report_hash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        observation_hash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        triage_policy_version: { type: [string, "null"] }
        issue_resolutions: { type: array, items: { $ref: "#/components/schemas/IssueResolution" } }
        track_resolutions:
          type: object
          additionalProperties: { type: string, enum: [TRAIN, REVIEW, REJECT] }
    AuditIntegrity:
      type: object
      required: [chain_valid]
      properties:
        chain_valid: { type: boolean }
        observation_artifact_valid: { type: [boolean, "null"] }
    FullAuditPayload:
      type: object
      required: [run_id, service_version, attention_summary, attention_details, observation_artifact, results, gate_results, model_routes, manifest, reviews, audit_integrity]
      properties:
        run_id: { type: string }
        service_version: { type: string }
        attention_summary: { $ref: "#/components/schemas/AttentionSummary" }
        attention_details: { type: array, items: { type: object, additionalProperties: true } }
        observation_artifact: { $ref: "#/components/schemas/ObservationArtifact" }
        results: { type: array, items: { type: object, additionalProperties: true } }
        gate_results: { type: array, items: { type: object, additionalProperties: true } }
        model_routes: { type: array, items: { type: object, additionalProperties: true } }
        manifest: { type: object, additionalProperties: true }
        reviews: { type: array, items: { $ref: "#/components/schemas/ReviewEvent" } }
        audit_integrity: { $ref: "#/components/schemas/AuditIntegrity" }
    ObservationArtifact:
      type: object
      required: [available, url, count, sha256, valid]
      properties:
        available: { type: boolean }
        url: { type: [string, "null"] }
        count: { type: integer, minimum: 0 }
        sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        valid: { type: [boolean, "null"] }
      additionalProperties: false
    ReviewQueue:
      type: object
      required: [items, total, limit, offset, triage_policy_version]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReviewTaskSummary" } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        triage_policy_version: { type: string }
