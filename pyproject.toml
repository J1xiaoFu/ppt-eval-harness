[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-eval-harness"
version = "0.8.4"
description = "Deterministic, evidence-first PPT evaluation harness with PDMS-style scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PPT Eval Project" }]
dependencies = [
  "python-pptx>=1.0.2",
  "Pillow>=10.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
ppt-eval = "ppt_eval.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ppt_eval.profiles" = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
