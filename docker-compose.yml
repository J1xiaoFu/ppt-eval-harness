services:
  api:
    build: .
    command: uvicorn ppt_eval.api:app --host 0.0.0.0 --port 8000
    environment:
      PPT_EVAL_DATA_DIR: /var/lib/ppt-eval
      # Passed at container start, never copied into the image build context.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      PPT_EVAL_QWEN_AUDIT_ENABLED: ${PPT_EVAL_QWEN_AUDIT_ENABLED:-}
      PPT_EVAL_QWEN_FLASH_MODEL: ${PPT_EVAL_QWEN_FLASH_MODEL:-qwen3.8-flash}
      PPT_EVAL_QWEN_HTTP_TIMEOUT_SECONDS: ${PPT_EVAL_QWEN_HTTP_TIMEOUT_SECONDS:-120}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      PPT_EVAL_ZHIPU_AUDIT_ENABLED: ${PPT_EVAL_ZHIPU_AUDIT_ENABLED:-}
      PPT_EVAL_ZHIPU_BASE_URL: ${PPT_EVAL_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      PPT_EVAL_ZHIPU_MODEL: ${PPT_EVAL_ZHIPU_MODEL:-glm-5.3-flash}
      PPT_EVAL_ZHIPU_HTTP_TIMEOUT_SECONDS: ${PPT_EVAL_ZHIPU_HTTP_TIMEOUT_SECONDS:-300}
      PPT_EVAL_REVIEW_RENDERING_ENABLED: ${PPT_EVAL_REVIEW_RENDERING_ENABLED:-true}
    volumes:
      - ./var:/var/lib/ppt-eval
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
